name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint:ci

      - name: Run oxfmt check
        run: npm run format:ci

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:front

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_ENABLED: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests (unit + functional)
        run: npm run test --workspace @foundry/web -- unit functional

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  codegen-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # "node ace codegen" (warmup) is the entry point that regenerates every
      # committed codegen file: the assembler init hooks rewrite the server
      # indexes and pages.d.ts at startup, and the Tuyau client registry is
      # written once the app commits its routes (routesScanned hook), which the
      # build, typecheck and test commands never trigger. It runs in the app
      # workspace and is watched on its own completion marker ("Codegen files
      # generated") instead of a registry log line. ".env.test" boots the full
      # app without external services (lazy Redis, memory session/limiter), so
      # this job needs no service containers.
      - name: Regenerate codegen output
        working-directory: apps/web
        run: |
          cp .env.test .env
          mkdir -p tmp
          node ace codegen > tmp/codegen.log 2>&1 &
          CODEGEN_PID=$!
          for i in $(seq 1 90); do
            if grep -q 'Codegen files generated' tmp/codegen.log; then
              break
            fi
            if ! kill -0 "$CODEGEN_PID" 2>/dev/null; then
              echo 'Codegen exited before the completion marker was logged:'
              cat tmp/codegen.log
              exit 1
            fi
            sleep 1
          done
          kill "$CODEGEN_PID" 2>/dev/null || true
          if ! grep -q 'Codegen files generated' tmp/codegen.log; then
            echo 'Timed out waiting for the codegen completion marker:'
            cat tmp/codegen.log
            exit 1
          fi

      - name: Fail when the committed codegen output has drifted
        run: |
          if ! git diff --exit-code -- apps/web/.adonisjs/; then
            echo ''
            echo '::error::The committed apps/web/.adonisjs/ files are out of sync with the codegen output.'
            echo '::error::Run the codegen locally ("node ace codegen" from apps/web), then commit the updated apps/web/.adonisjs/ directory.'
            exit 1
          fi
