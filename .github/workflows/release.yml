name: Release

# Cuts a single GitHub release when a `v*` tag is pushed to `main` — the
# `full` flavor — and attaches one zip archive per flavor (`full`, `api`,
# `inertia`) as release assets.
#
# The flavor branches (`api`, `inertia`) are CI-regenerated artifacts: on every
# push to `main`, the flavor prune pipeline (flavor-prune.yml) force-pushes each
# flavor branch to the pruned tree of the pushed main commit, with a commit
# message of the form "chore(flavor): regenerate <flavor> from main <sha>".
#
# A release on main therefore has a natural, deterministic counterpart on each
# flavor: the commit the flavor branch was last regenerated from. The archives
# job waits for the flavor branch to catch up to the released commit (i.e. to
# carry a prune commit sourced from that exact SHA), tags its HEAD
# (`<tag>-<flavor>`, e.g. `v2.0.0-inertia`) and archives that exact commit. No
# code is rebuilt here: the heavy prune + gates are already done by
# flavor-prune.yml, so this pipeline only tags, archives and publishes.
#
# The archives are standalone: the flavor machinery is stripped (the
# `flavor-prune` and `release` workflows, the `dependabot-autofix` workflow, the
# prune tooling under `tooling/` and its tests, plus the `#prune` import and the
# root `tsc` segment of the typecheck script that exist only to serve them).
# The `docker-image` build workflow ships with the tree (manual dispatch
# only), so each flavor can build and push its own image.
#
# Triggered by a tag push (the normal path) or manually via workflow_dispatch to
# (re)cut the release for an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag on main to (re)cut the release for'
        required: true
        type: string

permissions:
  contents: write

# Serialize per tag so a re-triggered run never races a live one on the same tag.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ─── Stage 1: main release ────────────────────────────────────────────────
  # Resolves the tag and the commit it points at, extracts the matching
  # changelog section from the README, and creates the single GitHub release
  # that the per-flavor archive assets are attached to.
  release-main:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and target commit
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            # The tag may not be present locally for a manual dispatch — fetch it.
            git fetch origin --tags
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          SHA="$(git rev-list -n 1 "${TAG}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG} @ ${SHA}"

      - name: Extract release notes from the README changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${TAG#v}"
          # Print the "### v<VER>" section of README.md up to (but not including)
          # the next level-3 heading ("### "). The "####" sub-headings inside the
          # section do not match "^### " (the fourth character is "#", not a
          # space), so the whole section — including its subsections — is kept.
          awk -v ver="${VER}" '
            /^### / { if (insec) exit; if ($0 == "### v" ver) insec = 1 }
            insec { print }
          ' README.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section for ${TAG} in README.md — using a default note."
            printf 'Release %s.\n\nSee the changelog in the repository README.\n' "${TAG}" > notes.md
          fi
          printf '\n---\n\n**Flavor archives:** one zip per flavor is attached to this release — the `full` archive is this tag; the `api` and `inertia` archives are the pruned trees regenerated from this commit. Every archive is standalone: the flavor machinery is stripped and the Docker image build workflow is included.\n' >> notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
            exit 0
          fi
          gh release create "${TAG}" --title "${TAG}" --notes-file notes.md
          echo "Created release ${TAG}."

  # ─── Stage 2: per-flavor archives ─────────────────────────────────────────
  # For each flavor: wait until the flavor branch has been regenerated from the
  # released commit, tag its HEAD, strip the flavor machinery, and upload the
  # zip as an asset of the main release.
  archives:
    runs-on: ubuntu-latest
    needs: release-main
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, api, inertia]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for the flavor branch to catch up to the released commit
        if: ${{ matrix.flavor != 'full' }}
        shell: bash
        run: |
          set -uo pipefail
          FLAVOR="${{ matrix.flavor }}"
          SHA="${{ needs.release-main.outputs.sha }}"
          for attempt in $(seq 1 60); do
            # Fetch inside the loop: the prune pipeline force-pushes the branch
            # after this step starts, so a one-shot fetch would only ever see the
            # pre-release state and the poll would run out without matching.
            # The '+' allows the non-fast-forward update: the regenerated branch
            # is not a descendant of the previously fetched HEAD, so a plain
            # refspec would be rejected (and silently, behind the 2>/dev/null)
            # on every iteration, pinning the poll on the stale state.
            git fetch origin "+refs/heads/${FLAVOR}:refs/remotes/origin/${FLAVOR}" 2>/dev/null || true
            MSG="$(git log -1 --format=%B "refs/remotes/origin/${FLAVOR}" 2>/dev/null || true)"
            if printf '%s' "${MSG}" | grep -qF "from main ${SHA}"; then
              echo "Flavor branch '${FLAVOR}' is pruned from ${SHA}."
              exit 0
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "::error::Flavor branch '${FLAVOR}' did not catch up to ${SHA} within the timeout."
              echo "::error::Its HEAD commit is: $(printf '%s' "${MSG}" | head -n 1)"
              exit 1
            fi
            sleep 30
          done

      - name: Tag the flavor branch
        if: ${{ matrix.flavor != 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          TAG="${{ needs.release-main.outputs.tag }}"
          FLAVOR_TAG="${TAG}-${FLAVOR}"
          git fetch origin "+refs/heads/${FLAVOR}:refs/remotes/origin/${FLAVOR}"

          if git ls-remote --exit-code --tags origin "${FLAVOR_TAG}" >/dev/null 2>&1; then
            echo "Tag ${FLAVOR_TAG} already exists — reusing it."
            git fetch origin "refs/tags/${FLAVOR_TAG}"
          else
            git tag "${FLAVOR_TAG}" "refs/remotes/origin/${FLAVOR}"
            git push origin "${FLAVOR_TAG}"
          fi

      - name: Build the flavor archive and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          TAG="${{ needs.release-main.outputs.tag }}"
          VER="${TAG#v}"
          NAME="adonisjs-foundry-${VER}-${FLAVOR}"

          if [ "${FLAVOR}" = "full" ]; then
            git fetch origin "refs/tags/${TAG}"
            REF="refs/tags/${TAG}"
          else
            REF="refs/tags/${TAG}-${FLAVOR}"
          fi

          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT
          mkdir -p "${STAGE}/${NAME}"
          git archive "${REF}" | tar -x -C "${STAGE}/${NAME}"

          # Standalone archive: strip the flavor machinery — the workflows that
          # manage flavor branches and this release pipeline, and the prune
          # tooling with its tests. The root tsconfig is kept (AdonisJS needs
          # it); its prune include dangles exactly like on the flavor branches.
          cd "${STAGE}/${NAME}"
          rm -rf tooling apps/web/tests/unit/prune
          rm .github/workflows/flavor-prune.yml .github/workflows/release.yml .github/workflows/dependabot-autofix.yml
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.imports) {
              delete pkg.imports["#prune/*"];
              if (Object.keys(pkg.imports).length === 0) delete pkg.imports;
            }
            if (pkg.scripts && pkg.scripts.typecheck && pkg.scripts.typecheck.startsWith("tsc --noEmit && "))
              pkg.scripts.typecheck = pkg.scripts.typecheck.replace("tsc --noEmit && ", "");
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            // The root tsconfig stays (AdonisJS needs it); only the line that
            // includes the prune tooling goes.
            const ts = JSON.parse(fs.readFileSync("tsconfig.json", "utf8"));
            if (ts.include) delete ts.include;
            fs.writeFileSync("tsconfig.json", JSON.stringify(ts, null, "\t") + "\n");
          '

          cd "${STAGE}"
          zip -rq "${NAME}.zip" "${NAME}"
          gh release upload "${TAG}" "${NAME}.zip" --clobber
          echo "Uploaded ${NAME}.zip to ${TAG}."
